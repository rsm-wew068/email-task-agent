name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: check
          POSTGRES_DB: eta
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Typecheck frontend
        run: npm --prefix web run typecheck

      - name: Contract drift check (openapi.json + generated types)
        run: |
          uv run python scripts/export_openapi.py
          npm --prefix web run gen:api
          git diff --exit-code web/openapi.json web/src/lib/api-schema.ts

      - name: Build frontend (production)
        run: npm --prefix web run build

      - name: Install Playwright chromium (e2e)
        run: uv run playwright install chromium --with-deps

      - name: Lint
        run: uv run ruff check .

      - name: Tests (unit + API + PostgresStore + Next.js e2e)
        run: uv run pytest
        env:
          POSTGRES_TEST_URL: postgresql://postgres:check@127.0.0.1:5455/eta

      - name: E1 smoke eval (null extractor, harness sanity)
        run: uv run python -m email_task_agent.evals.e1

      - name: E2 reconciliation gate (must pass 100%)
        run: uv run python -m email_task_agent.evals.e2

      - name: E1-U wrong-link harness
        run: uv run python -m email_task_agent.evals.e1u --extractor scripted:perfect --baseline evals/baselines/e1u_baseline.json
