<tr id="task-{{ task.id }}">
  <td><strong>{{ task.title }}</strong>{% if task.needs_review %} <span class="badge">review</span>{% endif %}</td>
  <td class="muted">{{ task.owner_email or "—" }}</td>
  <td>{{ task.due_date or "—" }}</td>
  <td><span class="badge {{ task.status }}">{{ task.status }}</span></td>
  <td>
    <form hx-post="/tasks/{{ task.id }}/status" hx-target="#task-{{ task.id }}" hx-swap="outerHTML" class="inline">
      <input type="hidden" name="status" value="{{ 'open' if task.status != 'open' else 'done' }}">
      <button>{{ "Mark open" if task.status != 'open' else "Mark done" }}</button>
    </form>
    {% if merged_recently.get(task.id) %}
    <form hx-post="/tasks/{{ task.id }}/split" hx-target="#review-queue" class="inline">
      <button>Split (undo merge)</button>
    </form>
    {% endif %}
  </td>
</tr>
